<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-Glass Auto AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.header{background:#1e293b;padding:20px;text-align:center;border-bottom:1px solid #334155}
.header h1{font-size:24px;color:#3b82f6}
.header p{color:#94a3b8;font-size:13px;margin-top:4px}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:700px;margin:0 auto;width:100%}
.msg{margin:10px 0;padding:12px 16px;border-radius:14px;max-width:82%;line-height:1.5;font-size:15px}
.msg.user{background:#3b82f6;margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
.msg .lb{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.controls{background:#1e293b;padding:16px;border-top:1px solid #334155;display:flex;flex-direction:column;align-items:center;gap:10px}
.mic-row{display:flex;align-items:center;gap:14px}
#mic{width:68px;height:68px;border-radius:50%;border:3px solid #3b82f6;background:transparent;color:#3b82f6;font-size:28px;cursor:pointer;transition:all .2s}
#mic:hover{background:rgba(59,130,246,.15)}
#mic.rec{background:#ef4444;border-color:#ef4444;color:#fff;animation:pulse 1.2s infinite}
#mic:disabled{opacity:.3;cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
#status{color:#94a3b8;font-size:13px;min-width:160px;text-align:center}
.text-row{display:flex;gap:8px;width:100%;max-width:700px}
.text-row input{flex:1;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:10px 14px;border-radius:10px;font-size:15px;outline:none}
.text-row input:focus{border-color:#3b82f6}
.text-row button{background:#3b82f6;color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.welcome{text-align:center;padding:50px 20px;color:#64748b}
.welcome .icon{font-size:44px;margin-bottom:12px}
</style>
</head>
<body>
<div class="header">
<h1>V-Glass Auto</h1>
<p>Agent vocal streaming</p>
</div>
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="icon">&#x1F3A4;</div>
<p>Appuie sur le micro et parle. L agent repond en temps reel.</p>
</div>
</div>
<div class="controls">
<div class="mic-row">
<span id="status">Pret</span>
<button id="mic" onclick="toggleRec()">&#x1F3A4;</button>
</div>
<div class="text-row">
<input id="tin" placeholder="Ou tape ici..." onkeypress="if(event.key==='Enter')sendTxt()">
<button onclick="sendTxt()">Envoyer</button>
</div>
</div>
<script>
let rec=false,mr,chunks=[],ws,history=[],audioQueue=[],playing=false;
const chat=document.getElementById('chat'),status=document.getElementById('status'),btn=document.getElementById('mic');

function initWS(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onmessage=function(e){
    const d=JSON.parse(e.data);
    if(d.type==='status') status.textContent=d.text;
    if(d.type==='user_text') addMsg(d.text,'user');
    if(d.type==='ai_text_chunk'){
      let el=document.getElementById('ai-current');
      if(!el){el=document.createElement('div');el.className='msg ai';el.id='ai-current';el.innerHTML='<div class="lb">Agent</div><span id="ai-txt"></span>';chat.appendChild(el)}
      document.getElementById('ai-txt').textContent+=d.text+' ';
      chat.scrollTop=chat.scrollHeight;
    }
    if(d.type==='audio_chunk'){
      audioQueue.push(d.audio);
      if(!playing) playNext();
    }
    if(d.type==='done'){
      const el=document.getElementById('ai-current');
      if(el)el.removeAttribute('id');
      status.textContent='Pret';
      btn.disabled=false;
    }
  };
  ws.onclose=function(){setTimeout(initWS,2000)};
}
initWS();

function playNext(){
  if(audioQueue.length===0){playing=false;return}
  playing=true;
  const b64=audioQueue.shift();
  const a=new Audio('data:audio/wav;base64,'+b64);
  a.onended=playNext;
  a.play().catch(()=>{playing=false});
}

function addMsg(t,r){
  const w=document.getElementById('welcome');if(w)w.remove();
  const d=document.createElement('div');d.className='msg '+r;
  d.innerHTML='<div class="lb">'+(r==='user'?'Vous':'Agent')+'</div>'+t;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}

async function toggleRec(){
  if(rec){mr.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(s);chunks=[];
    mr.ondataavailable=function(e){chunks.push(e.data)};
    mr.onstop=async function(){
      rec=false;btn.classList.remove('rec');btn.disabled=true;
      s.getTracks().forEach(function(t){t.stop()});
      const blob=new Blob(chunks,{type:'audio/webm'});
      const buf=await blob.arrayBuffer();
      if(ws&&ws.readyState===1) ws.send(buf);
      status.textContent='Traitement...';
    };
    mr.start();rec=true;btn.classList.add('rec');status.textContent='Parle...';
  }catch(e){status.textContent='Micro non disponible'}
}

async function sendTxt(){
  const i=document.getElementById('tin'),t=i.value.trim();if(!t)return;
  i.value='';addMsg(t,'user');
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:history})});
    const d=await r.json();addMsg(d.response,'ai');
    history.push({role:'user',content:t},{role:'assistant',content:d.response});
    const tts=await fetch('/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:d.response})});
    const blob=await tts.blob();
    new Audio(URL.createObjectURL(blob)).play();
  }catch(e){addMsg('Erreur: '+e.message,'ai')}
}
</script>
</body>
</html>
