<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔧 V-Glass Auto AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:24px;text-align:center;border-bottom:1px solid #334155}
.header h1{font-size:26px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:#94a3b8;font-size:13px;margin-top:6px}
.chat-box{flex:1;overflow-y:auto;padding:20px;max-width:720px;margin:0 auto;width:100%}
.msg{margin:12px 0;padding:14px 18px;border-radius:16px;max-width:82%;line-height:1.6;font-size:15px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{background:linear-gradient(135deg,#3b82f6,#2563eb);margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
.msg .label{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.controls{background:#1e293b;padding:16px 20px;border-top:1px solid #334155;display:flex;flex-direction:column;align-items:center;gap:12px}
.mic-row{display:flex;align-items:center;gap:16px}
#mic-btn{width:72px;height:72px;border-radius:50%;border:3px solid #3b82f6;background:transparent;color:#3b82f6;font-size:30px;cursor:pointer;transition:all .2s}
#mic-btn:hover{background:rgba(59,130,246,.15);transform:scale(1.05)}
#mic-btn.recording{background:#ef4444;border-color:#ef4444;color:#fff;animation:pulse 1.2s infinite}
#mic-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
#status{color:#94a3b8;font-size:13px;min-width:180px;text-align:center}
.text-row{display:flex;gap:10px;width:100%;max-width:720px}
.text-row input{flex:1;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:12px 16px;border-radius:12px;font-size:15px;outline:none;transition:border .2s}
.text-row input:focus{border-color:#3b82f6}
.text-row button{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;padding:12px 22px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600;transition:opacity .2s}
.text-row button:hover{opacity:.9}
.typing{display:flex;gap:5px;padding:14px 18px;margin:12px 0;max-width:82%}
.typing span{width:8px;height:8px;background:#3b82f6;border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.welcome{text-align:center;padding:60px 20px;color:#64748b}
.welcome .icon{font-size:48px;margin-bottom:16px}
.welcome p{font-size:15px;max-width:400px;margin:0 auto;line-height:1.6}
</style>
</head>
<body>
<div class="header">
  <h1>🔧 V-Glass Auto</h1>
  <p>Agent vocal — parle ou tape pour tester</p>
</div>

<div class="chat-box" id="chat">
  <div class="welcome">
    <div class="icon">🎤</div>
    <p>Appuie sur le micro et parle, ou tape un message. L'agent V-Glass Auto te répond vocalement.</p>
  </div>
</div>

<div class="controls">
  <div class="mic-row">
    <span id="status">Prêt</span>
    <button id="mic-btn" onclick="toggleRecord()">🎤</button>
  </div>
  <div class="text-row">
    <input id="text-in" placeholder="Ou tape ton message ici..." onkeypress="if(event.key==='Enter')sendText()">
    <button onclick="sendText()">Envoyer</button>
  </div>
</div>

<script>
let mediaRecorder, chunks=[], recording=false, history=[];
const chat=document.getElementById('chat');
const btn=document.getElementById('mic-btn');
const status=document.getElementById('status');
let welcomeCleared=false;

function clearWelcome(){
  if(!welcomeCleared){const w=chat.querySelector('.welcome');if(w)w.remove();welcomeCleared=true}
}

function addMsg(text,role){
  clearWelcome();
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML='<div class="label">'+(role==='user'?'🧑 Vous':'🤖 Agent')+'</div>'+text.replace(/\n/g,'<br>');
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function showTyping(){
  clearWelcome();
  const d=document.createElement('div');
  d.className='typing';d.id='typing';
  d.innerHTML='<span></span><span></span><span></span>';
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
function hideTyping(){const t=document.getElementById('typing');if(t)t.remove()}

async function toggleRecord(){
  if(recording){mediaRecorder.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);
    chunks=[];
    mediaRecorder.ondataavailable=e=>chunks.push(e.data);
    mediaRecorder.onstop=async()=>{
      recording=false;
      btn.classList.remove('recording');
      btn.disabled=true;
      status.textContent='🔄 Traitement...';
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:'audio/webm'});
      const form=new FormData();
      form.append('file',blob,'audio.webm');
      form.append('history',JSON.stringify(history));
      showTyping();
      try{
        const r=await fetch('/voice-chat',{method:'POST',body:form});
        const data=await r.json();
        hideTyping();
        if(data.user_text)addMsg(data.user_text,'user');
        if(data.ai_text){
          addMsg(data.ai_text,'ai');
          history.push({role:'user',content:data.user_text});
          history.push({role:'assistant',content:data.ai_text});
          if(data.audio_base64){
            const audio=new Audio('data:audio/wav;base64,'+data.audio_base64);
            audio.play();
          }
        }
        if(data.error&&!data.ai_text)addMsg('Je n\'ai pas compris, réessayez.','ai');
        status.textContent='Prêt';
      }catch(e){hideTyping();status.textContent='❌ '+e.message}
      btn.disabled=false;
    };
    mediaRecorder.start();
    recording=true;
    btn.classList.add('recording');
    status.textContent='🔴 Parle...';
  }catch(e){status.textContent='❌ Micro non disponible'}
}

async function sendText(){
  const input=document.getElementById('text-in');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  addMsg(text,'user');
  showTyping();
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history})});
    const data=await r.json();
    hideTyping();
    addMsg(data.response,'ai');
    history.push({role:'user',content:text});
    history.push({role:'assistant',content:data.response});
    const tts=await fetch('/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:data.response})});
    const blob=await tts.blob();
    const audio=new Audio(URL.createObjectURL(blob));
    audio.play();
  }catch(e){hideTyping();addMsg('Erreur: '+e.message,'ai')}
}
</script>
</body>
</html>
